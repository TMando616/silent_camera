# XcodeGen の設定。.xcodeproj はここから生成する（`xcodegen generate`）。
# .xcodeproj は git に入れず、このファイルを正とする（差分が読みやすく、競合しにくいため）
name: SilentCamera
options:
  bundleIdPrefix: com.tmando616
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SilentCamera:
    type: application
    platform: iOS
    sources: [SilentCamera]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tmando616.silentcamera
        TARGETED_DEVICE_FAMILY: "1"   # iPhone のみ
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 無音カメラ   # 仮称
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: 写真を撮影するためにカメラを使います
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 撮影した写真を写真アプリに保存します
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 実機で動かすときは、Xcode に Apple ID を登録したあと DEVELOPMENT_TEAM を入れる
